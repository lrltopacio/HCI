<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotorPH Payroll Wireframe</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-presets="react,typescript">
    const { useState, useEffect, Fragment, createContext, useContext } = React;

    fetch('App%20v1.tsx')
      .then(res => res.text())
      .then(code => {
        // Remove import statements that break browser execution
        const cleanCode = code
          .replace(/import\s+.*?from\s+['"].*?['"];?/g, '')
          .replace(/export\s+default\s+/g, 'window.App = ');

        // Compile TSX/JSX to plain JS
        const compiled = Babel.transform(cleanCode, {
          presets: ['react', 'typescript']
        }).code;

        // Execute the code in scope
        eval(compiled);

        // Render the root React component
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(window.App));
      })
      .catch(err => console.error("Error loading app:", err));
  </script>
</body>
</html>
